[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "signal-risk-sdk"
version = "0.3.0"
description = "Constructed-function risk measurement with deterministic graders and clustered statistics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Signal"}]
dependencies = [
  "pydantic>=2.12,<3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "statsmodels>=0.14.4,<0.15",
  "rich>=13,<15",
]

[project.urls]
Repository = "https://github.com/felofix/signal-sdk"
Documentation = "https://github.com/felofix/signal-sdk/blob/main/docs/README.md"

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "ruff>=0.9,<1", "fastapi>=0.115,<1"]

[project.scripts]
signal-sdk = "signal_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
