name: Test SDK
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node dist/src/cli.js validate
      - run: node dist/src/cli.js demo --generic --scenarios 12 --repetitions 2 --output outputs/ci
      - run: npm run docs
      - run: npm pack --dry-run
